[demo]
name = "demo"
output_dir = "./dist"
speed = "2x"
targets = ["gif", "mp4"]
prompt = '\[\e[1;32m\]ghScaff@univerlab\[\e[0m\]:\[\e[1;34m\]~\[\e[0m\]$ '

[typing]
base_ms = 80
salt_ms = 15

[[sources]]
id = "main"
type = "terminal"

[[sources]]
id = "github"
type = "browser"
url = "https://github.com/jheisonmb/demo-ghscaff"
theme = "dark"

[layout]
width = 1440
height = 1080
fps = 15
line_height = 1.2000000476837158
background = "#0b0f14"
font_family = "IBM Plex Mono"

