# Applying is a run of silent API calls: wait for the prompts that follow it,
# never for quiet, or the take cuts away (and ends) mid-scaffold.
# The rust template asks for CARGO_REGISTRY_TOKEN; skip it with esc (ghscaff
# then says to set it later with `ghscaff apply`).
[[timeline]]
action = "wait_for_screen"
match = "Secret CARGO_REGISTRY_TOKEN"
timeout_ms = 180000

[[timeline]]
action = "wait"
duration_ms = 1200

[[timeline]]
action = "keypress"
key = "esc"

[[timeline]]
action = "wait_for_screen"
match = "Clone the repository with gitkit?"
timeout_ms = 60000

[[timeline]]
action = "type"
text = "n"
human_salt = true

[[timeline]]
action = "wait"
duration_ms = 200

[[timeline]]
action = "keypress"
key = "enter"

[[timeline]]
action = "wait_for_screen"
match = "Sponsor button"
timeout_ms = 30000

